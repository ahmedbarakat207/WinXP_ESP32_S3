; tiny386 on ESP32-S3: Windows XP (Standard HAL) with SD-backed RAM paging.
;
; Copy to the SD card as /sdcard/tiny386.ini, together with:
;   /sdcard/bios.bin     (SeaBIOS, from this repo)
;   /sdcard/vgabios.bin  (SeaBIOS VGA BIOS, from this repo)
;   /sdcard/xp.img       (your XP disk image, Standard-PC HAL!)
;
; The emulator creates /sdcard/xpswap.bin automatically (up to ~16MB).
; Use a spare SD card: paging wears flash. FAT32 or exFAT both work.
;
; IMPORTANT: install XP with the Standard PC HAL (no ACPI). tiny386's
; BIOS provides no ACPI tables, so an ACPI-HAL image bugchecks during
; boot. Convert an existing image in QEMU: Device Manager -> Computer ->
; Update Driver -> "Standard PC", then shut down cleanly.

[esp]
; WIFI keyboard/mouse forwarding (./wifikbd on a PC). Costs ~1MB RAM,
; which shrinks the resident window below. Leave empty for headless.
ssid =
pass =
; USB HID keyboard/mouse (experimental). Do NOT enable together with WIFI.
enable_usb = 1

[pc]
bios = /sdcard/bios.bin
vga_bios = /sdcard/vgabios.bin
; 16MB guest: smallest size this image boots with (matches QEMU -m 16M).
mem_size = 16M
vga_mem_size = 320K
hda = /sdcard/xp.img
fill_cmos = 0
; Resident RAM window. 0 = auto (all free PSRAM minus frame buffer, VGA
; memory and a safety reserve). Set explicitly to tune, e.g. 5M on an 8MB
; module when WiFi is on. Must stay >= 2M (low memory is pinned).
swap_size = 0
swap_file = /sdcard/xpswap.bin

[display]
; Overridden by the board's LCD_WIDTH/HEIGHT at boot.
width = 640
height = 480

[cpu]
gen = 5
fpu = 1
